# DP right: 3440x1440@143.97
monitor = DP-2, 3440x1440@143.97501, 0x0, 1
# HDMI left: 4K@60, scale 1.67
monitor = HDMI-A-2, disable

source = ~/.config/hypr/workspaces-1-9-a-z.conf

# ---------- Basics ----------
# Workspace / window-management modifier.
# If you really want physical Alt for workspace operations, change this to ALT.
$mod = SUPER
$filemanager = dolphin
$terminal = ghostty

# ---------- NVIDIA / Wayland compatibility ----------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = LIBVA_DRIVER_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
# env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

# ---------- Autostart essentials ----------
# exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start hyprpolkitagent
exec-once = /usr/libexec/pam_kwallet_init
# exec-once = systemctl --user start hyprpolkitagent
# exec-once = /usr/libexec/hyprpolkitagent
# exec-once = xdg-desktop-portal-hyprland
# exec-once = xdg-desktop-portal
# exec-once = swww-daemon
exec-once = mako
exec-once = fcitx5 -d
exec-once = waybar
exec-once = blueman-applet
exec-once = nm-applet
# exec-once = systemctl --user start hypridle.service
exec-once = hypridle
exec-once = hyprpaper
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ---------- Keybinds: apps / session ----------
bind = ALT, SPACE, exec, rofi -show drun
bind = ALT, RETURN, exec, $terminal
bind = ALT, T, exec, $filemanager
bind = ALT, Q, killactive
bind = ALT, M, exit
bind = ALT, L, exec, hyprlock
bind = CTRL ALT, V, exec, sh -lc 'cliphist list | rofi -dmenu -i -p "Clipboard" | cliphist decode | wl-copy; wtype -M ctrl -k v -m ctrl'

# Screenshot
bind = ALT SHIFT, 4, exec, grim -g "$(slurp)" - | wl-copy

# ---------- Keybinds: mako ----------
# Alt + N: restore last notification
bind = ALT, N, exec, makoctl restore

# Alt + Shift + N: toggle reading mode
bind = ALT SHIFT, N, exec, sh -c 'makoctl mode | grep -qx reading && makoctl mode -r reading || makoctl mode -a reading'

# ---------- Keybinds: KeePassXC scratchpad ----------
# Alt+K shows/hides KeePassXC. Alt+Shift+K is a fallback launcher.
# SUPER+K is kept for Vim-style focus-up.
bind = ALT, K, togglespecialworkspace, keepass
bind = ALT SHIFT, K, exec, keepassxc

# ---------- Keybinds: numeric workspaces ----------
# Numbers are temporary / per-monitor work areas.
# This keeps your current XMonad-like behavior for numeric workspaces.
bind = $mod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mod, 0, focusworkspaceoncurrentmonitor, 10

# Move active window to numeric workspace and follow it.
# Example: if workspace 2 is visible on another monitor, $mod+Shift+2 moves the window there.
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ---------- Keybinds: semantic letter workspaces ----------
# Letters are global semantic home workspaces, not monitor-local names.
# $mod+R jumps to R wherever it currently lives; it does NOT pull R to the current monitor.
# Kept small on purpose: R/V/X/M/W/F/T are high-value anchors; numbers remain the flexible scratch space.
bind = $mod, R, workspace, name:R
bind = $mod, V, workspace, name:V
bind = $mod, X, workspace, name:X
bind = $mod, M, workspace, name:M
bind = $mod, W, workspace, name:W
bind = $mod, F, workspace, name:F
bind = $mod, T, workspace, name:T

# Move active window to semantic workspace and follow it.
# If the target semantic workspace already exists on another monitor, the window moves there.
bind = $mod SHIFT, R, movetoworkspace, name:R
bind = $mod SHIFT, V, movetoworkspace, name:V
bind = $mod SHIFT, X, movetoworkspace, name:X
bind = $mod SHIFT, M, movetoworkspace, name:M
bind = $mod SHIFT, W, movetoworkspace, name:W
bind = $mod SHIFT, F, movetoworkspace, name:F
bind = $mod SHIFT, T, movetoworkspace, name:T

# Optional escape hatch: explicitly pull semantic workspace to current monitor.
# Normal use should be $mod+R/V/X..., not these.
bind = $mod CTRL, R, focusworkspaceoncurrentmonitor, name:R
bind = $mod CTRL, V, focusworkspaceoncurrentmonitor, name:V
bind = $mod CTRL, X, focusworkspaceoncurrentmonitor, name:X
bind = $mod CTRL, M, focusworkspaceoncurrentmonitor, name:M
bind = $mod CTRL, W, focusworkspaceoncurrentmonitor, name:W
bind = $mod CTRL, F, focusworkspaceoncurrentmonitor, name:F
bind = $mod CTRL, T, focusworkspaceoncurrentmonitor, name:T

# Back-and-forth: previous workspace per monitor
bind = $mod, TAB, workspace, previous_per_monitor

# ---------- Keybinds: Vim focus / monitor move / local rearrange ----------
# Focus between windows: Vim HJKL.
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move active window to neighboring monitor's CURRENT workspace.
# This is for temporary layout changes without changing the workspace name.
bind = $mod SHIFT, H, movewindow, mon:l
bind = $mod SHIFT, J, movewindow, mon:d
bind = $mod SHIFT, K, movewindow, mon:u
bind = $mod SHIFT, L, movewindow, mon:r

# Rearrange windows inside the current workspace.
bind = $mod CTRL, H, swapwindow, l
bind = $mod CTRL, J, swapwindow, d
bind = $mod CTRL, K, swapwindow, u
bind = $mod CTRL, L, swapwindow, r

# Focus monitor directly with arrows.
bind = $mod, left,  focusmonitor, l
bind = $mod, right, focusmonitor, r
bind = $mod, up,    focusmonitor, u
bind = $mod, down,  focusmonitor, d

# Move the current workspace to another monitor with arrows.
bind = $mod SHIFT, left,  movecurrentworkspacetomonitor, l
bind = $mod SHIFT, right, movecurrentworkspacetomonitor, r
bind = $mod SHIFT, up,    movecurrentworkspacetomonitor, u
bind = $mod SHIFT, down,  movecurrentworkspacetomonitor, d

# ---------- Keybinds: brightness / media / volume ----------
# binde = , XF86MonBrightnessUp,   exec, brightnessctl -d ddcci8 set +10%
# binde = , XF86MonBrightnessDown, exec, brightnessctl -d ddcci8 set 10%-
# binde = , XF86MonBrightnessUp,   exec, /usr/local/sbin/ddcci8-brightness up
# binde = , XF86MonBrightnessDown, exec, /usr/local/sbin/ddcci8-brightness down

bind  = , XF86AudioPlay, exec, playerctl play-pause
bind  = , XF86AudioNext, exec, playerctl next
bind  = , XF86AudioPrev, exec, playerctl previous

binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# bind = , mouse_left, workspace, e+1
# bind = , mouse_right, workspace, e-1

# M590 wheel tilt: workspace cycle 1-9, a-z
bind = , mouse_left, exec, ~/.config/hypr/scripts/ws-cycle-1-9-A-Z-used.sh prev
bind = , mouse_right, exec, ~/.config/hypr/scripts/ws-cycle-1-9-A-Z-used.sh next

# ---------- Resize mode ----------
# $mod + minus enters resize mode. Press Esc, Enter, or $mod+minus to exit.
bind = $mod, minus, submap, resize

submap = resize

# Semantic resize: make the active window bigger / smaller.
# Use these first; they avoid the confusing right-window-gets-smaller issue of raw resizeactive.
binde = , equal, layoutmsg, splitratio +0.05
binde = SHIFT, equal, layoutmsg, splitratio +0.05
binde = , minus, layoutmsg, splitratio -0.05

# Fine semantic resize.
binde = CTRL, equal, layoutmsg, splitratio +0.01
binde = CTRL SHIFT, equal, layoutmsg, splitratio +0.01
binde = CTRL, minus, layoutmsg, splitratio -0.01

# Physical boundary resize with Vim HJKL.
# Think of these as pushing the split line, not as guaranteed bigger/smaller for the active window.
binde = , H, resizeactive, -60 0
binde = , L, resizeactive,  60 0
binde = , K, resizeactive,  0 -60
binde = , J, resizeactive,  0  60

binde = SHIFT, H, resizeactive, -10 0 
binde = SHIFT, L, resizeactive,  10 0
binde = SHIFT, K, resizeactive,  0 -10
binde = SHIFT, J, resizeactive,  0  10

bind = , escape, submap, reset
bind = , RETURN, submap, reset
bind = $mod, minus, submap, reset

submap = reset

# ---------- Monitor profiles ----------
# DP-only
bind = $mod, F1, exec, hyprctl --batch "keyword monitor DP-2,3440x1440@143.97501,0x0,1; keyword monitor HDMI-A-2,disable"
# HDMI-only
bind = $mod, F2, exec, hyprctl --batch "keyword monitor HDMI-A-2,3840x2160@60,0x0,1.67; keyword monitor DP-2,disable"
# Both
bind = $mod, F3, exec, hyprctl --batch "keyword monitor DP-2,3440x1440@143.97501,0x0,1; keyword monitor HDMI-A-2,3840x2160@60,auto-left,1.67"

# ---------- Input ----------
input {
  kb_layout = us
  follow_mouse = 1
  repeat_delay = 250
  repeat_rate = 20
  touchpad {
    natural_scroll = true
  }
}

cursor {
  no_hardware_cursors = false
}

xwayland {
  force_zero_scaling = true
}

# ---------- Appearance / layout ----------
general {
  gaps_in = 5
  gaps_out = 5
  border_size = 2
}

decoration {
  rounding = 10
  rounding_power = 2

  # active_opacity = 0.95
  inactive_opacity = 0.95

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 1

    vibrancy = 0.1696
  }
}

animation = workspaces, 1, 4, default, fade
animation = windows, 1, 5, default, slide

# Dwindle: keep resize behavior biased toward the active window.
dwindle {
  smart_resizing = true
  split_bias = 1
}

# ---------- Window rules: pin apps to semantic workspaces ----------
# Use silent so apps opening on home workspaces do not steal your current view.
windowrule = match:class ^(firefox|firefox-esr|org\\.mozilla\\.firefox)$, workspace name:X silent
windowrule = match:class ^(code|Code|code-oss|com\\.visualstudio\\.code)$, workspace name:V silent
windowrule = match:class ^(rstudio|RStudio|com\\.rstudio\\.desktop)$, workspace name:R silent
windowrule = match:class org.gnome.FileRoller, float on

# KeePassXC: hidden special workspace / password drawer.
windowrule = match:class ^org\\.keepassxc\\.KeePassXC$, workspace special:keepass silent
windowrule = match:class ^org\\.keepassxc\\.KeePassXC$, no_initial_focus on
windowrule = match:class ^org\\.keepassxc\\.KeePassXC$, float on
windowrule = match:class ^org\\.keepassxc\\.KeePassXC$, center 1
windowrule = match:class ^org\\.keepassxc\\.KeePassXC$, size 70% 70%
windowrule = match:class ^org\\.keepassxc\\.KeePassXC$, persistent_size on

# Waybar session picker
windowrule = match:class ^(yad|Yad)$, match:title ^Waybar Session$, float on
windowrule = match:class ^(yad|Yad)$, match:title ^Waybar Session$, center 1
windowrule = match:class ^(yad|Yad)$, match:title ^Waybar Session$, size 36% 34%
